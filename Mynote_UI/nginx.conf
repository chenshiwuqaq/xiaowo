# =====================================================================
# MyNote 前端容器内的 Nginx 配置
#   1. 托管 Vite 构建出的静态文件
#   2. /api 与 /upload 反向代理到 backend:8080
#   3. 前端用的是 history 路由，找不到的路径回退到 index.html
# =====================================================================
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 与后端 spring.servlet.multipart.max-request-size=60MB 对齐
    client_max_body_size 60m;

    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    # 注意：不要给 text/event-stream 开 gzip，否则流式回答会被攒住

    # 入口页不缓存，避免发版后浏览器还拿旧的 hash 引用
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Vite 产物带 hash，可以长缓存
    location ^~ /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    # 后端接口：含 /api/ai/chat/stream 的 SSE，必须关掉缓冲才能逐字输出
    location ^~ /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 头像与笔记图片由后端的静态资源映射提供（卷 upload-data 挂载在 /app/upload）
    location ^~ /upload/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        expires            7d;
    }

    # 其余请求交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}
